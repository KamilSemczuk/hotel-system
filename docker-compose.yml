services:
  postgres:
    image: postgres:16
    container_name: hotel-db
    environment:
      POSTGRES_DB: hotel
      POSTGRES_USER: hotel
      POSTGRES_PASSWORD: hotel
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotel -d hotel"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-dotnet:
    build: ./backend-dotnet/HotelRevenue
    container_name: hotel-dotnet
    ports:
      - "5000:8080"

  backend-spring:
    build: ./backend-spring
    container_name: hotel-spring
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hotel
      SPRING_DATASOURCE_USERNAME: hotel
      SPRING_DATASOURCE_PASSWORD: hotel
      REVENUE_API_URL: http://backend-dotnet:8080
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      backend-dotnet:
        condition: service_started

  frontend:
    build: ./frontend-react
    container_name: hotel-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend-spring

volumes:
  pgdata:
